[project]
name = "turbine-sdk"
version = "0.1.0"
description = "Python SDK for running workflows through the TurbineOS Comfy API v2."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "SystasisIO" }]
keywords = ["comfyui", "comfy", "sdk", "generative-ai", "diffusion", "workflow"]
# No "License :: OSI Approved" classifier here on purpose: PyPI rejects
# uploads that set a license classifier alongside a PEP 639 License-Expression.
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx2>=2.16.0,<2.17.0",
    "blake3>=0.4",
    "pydantic>=2.6",
]

[project.urls]
Homepage = "https://github.com/SystasisIO/turbine-python-sdk"
Documentation = "https://github.com/SystasisIO/turbine-python-sdk"
Repository = "https://github.com/SystasisIO/turbine-python-sdk"
Issues = "https://github.com/SystasisIO/turbine-python-sdk/issues"

[project.optional-dependencies]
# Preview.to_pil() decodes in-progress preview frames to PIL images.
pil = ["Pillow>=10"]
# Regenerating turbine_low models from the vendored spec (codegen / CI drift check).
# Pinned: the drift gate compares byte-for-byte, so the generator version is
# load-bearing — an unpinned bump could reformat and flag false drift.
codegen = ["datamodel-code-generator~=0.68.1", "PyYAML>=6"]
dev = [
    # Pinned (compatible-release) so CI flags the same issues run-to-run, the
    # way datamodel-code-generator already is — an unpinned ruff/mypy bump
    # otherwise silently changes what CI catches between PRs.
    "ruff~=0.15.22",
    "mypy>=2.3,<2.5",
    "pytest~=9.1.1",
    "pytest-asyncio~=1.4.0",
    # A .coverage database was already being produced locally (and committed)
    # without the tool that makes it reproducible being declared anywhere.
    "pytest-cov~=7.0",
    "datamodel-code-generator~=0.68.1",
    "Pillow>=10",
    "PyYAML>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/turbine_sdk", "src/turbine_low"]

# Without an explicit list hatchling sweeps in everything git doesn't ignore,
# which put local dev droppings (a stale .coverage database) and repo-only
# config (.github/, .coderabbit.yaml, uv.lock) into the published sdist. Keep
# it to what's needed to build and run the tests from a tarball.
[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "tests/",
    "scripts/",
    "spec/",
    "README.md",
    "docs/",
    "AGENTS.md",
    "CONTRIBUTING.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# The generated model file is formatted by datamodel-code-generator (black/isort);
# keep ruff away from it so its output stays byte-identical for the drift check.
extend-exclude = ["src/turbine_low/models/_generated.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
exclude = ['src/turbine_low/models/_generated\.py']

# turbine_sdk is the hand-written public surface and ships py.typed, so every
# def in it should be annotated. Left off globally because turbine_low wraps
# generated code where the guarantee isn't ours to make.
[[tool.mypy.overrides]]
module = "turbine_sdk.*"
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["--strict-markers", "--strict-config"]
# Deprecations from httpx/pydantic/pytest-asyncio are the ones worth failing
# on: they are the advance warning before a dependency bump breaks the SDK.
# Deliberately not a blanket "error" -- the tests' own local HTTP servers emit
# ResourceWarning on teardown, which would turn 63 passing tests red without
# saying anything about the SDK.
filterwarnings = [
    "error::DeprecationWarning",
    "error::PendingDeprecationWarning",
    "error::httpx2._exceptions.HTTPXDeprecationWarning",
]

[tool.coverage.run]
source = ["src/turbine_sdk", "src/turbine_low"]
branch = true

[tool.coverage.report]
# The generated models are datamodel-code-generator output, not hand-written
# code under test, and TYPE_CHECKING blocks never execute at runtime.
omit = ["src/turbine_low/models/_generated.py"]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
