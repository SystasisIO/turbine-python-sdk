name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'codex/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install package with dev dependencies
        run: pip install -e .[dev]

      - name: Lint with ruff
        run: ruff check .

      - name: Check formatting with ruff
        run: ruff format --check .

      - name: Type check with mypy
        run: mypy src

      - name: Run tests
        run: pytest -v

  codegen-drift:
    name: turbine_low codegen drift
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install codegen dependencies
        run: pip install -e .[codegen]

      - name: Regenerate models and fail on drift
        run: python scripts/check_drift.py

  # Build and inspect artifacts without uploading to a package index.
  build-check:
    name: build-check (publish dry run)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install build tooling
        run: pip install build twine

      - name: Build wheel and sdist
        run: python -m build

      - name: Verify distribution metadata (publish dry run)
        run: twine check dist/*

      - name: Test installed wheel outside checkout
        shell: bash
        run: |
          wheels=(dist/*.whl)
          pip install "${wheels[0]}[dev]"
          consumer_dir=$(mktemp -d)
          cp tests/conftest.py tests/test_public_consumer.py tests/test_shared_schemas.py tests/test_native_extensions.py "$consumer_dir/"
          cp pyproject.toml "$consumer_dir/"
          cp -R tests/fixtures "$consumer_dir/fixtures"
          cd "$consumer_dir"
          unset PYTHONPATH
          python -c 'from pathlib import Path; import turbine_sdk; assert "site-packages" in str(Path(turbine_sdk.__file__).resolve())'
          python -m pytest -q .

  # NEW -- regression guard for the internal-reference leak this repo already
  # had once (see scripts/check_public_repo_hygiene.py for what it looks for
  # and why). Public repo, so this stays a permanent gate, not a one-time fix.
  public-repo-hygiene:
    name: public-repo-hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Scan for internal-only references
        run: python3 scripts/check_public_repo_hygiene.py
